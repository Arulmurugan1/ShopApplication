services:
  product-service-mongodb:
    image: mongo:7.0.5
    container_name: product-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: product_service_db
    ports:
      - "1060:27017"
    volumes:
      - ./mongo_data:/data/db

  order-service-mysql:
    image: mysql:8.0.45
    restart: always
    container_name: order-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_password
    ports:
      - "1010:3306"
    volumes:
      - ./mysql_order_data:/var/lib/mysql
      - ./docker/mysql/init-order-service.sql:/docker-entrypoint-initdb.d/init.sql
  
  inventory-service-mysql:
    image: mysql:8.0.45
    container_name: inventory-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_password
    ports:
      - "1030:3306"
    volumes:
      - ./mysql_inventory_data:/var/lib/mysql
      - ./docker/mysql/init-inv-service.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    command: ["start-dev", "--import-realm"]
    environment:
      DB_VENDOR : MYSQL
      DB_ADDR : mysql
      DB_DATABASE : keycloak_db
      DB_USER : keycloak
      DB_PASSWORD : keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adm!@#$%^&*(_+)n
    ports:
      - "1040:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql
      
  keycloak-mysql:
    image: mysql:8.0.45
    container_name: keycloak-mysql
    ports:
      - "1050:3306"
    volumes:
      - ./volume-data/mysql-keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak_db
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak
      
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 1070
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "1070:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:1070

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "1100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:1070