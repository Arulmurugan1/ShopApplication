spring.application.name=order-service

# DB configuration
spring.datasource.url=jdbc:mysql://localhost:1010/order_service_db
spring.datasource.username=root
spring.datasource.password=mysql_root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway configuration
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# Server configuration
server.port=1005

#inv service url
inventory.service.url=http://localhost:1025

# Documentation configuration
springdoc.api-docs.path=/order/api-docs
springdoc.swagger-ui.path=/order/swagger-ui.html

#Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/order/actuator
management.health.circuitbreakers.enabled=true

#Circuit Breaker configuration for Inventory service
resilience4j.circuitbreaker.instances.inventoryService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventoryService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventoryService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventoryService.minimumNumberOfCalls=5

# timeout configuration for inventoryService services to the fallback route
resilience4j.timelimiter.instances.inventoryService.timeoutDuration=3s

#Resilience4j retry configuration for inventoryService services
resilience4j.retry.instances.inventoryService.maxAttempts=3
resilience4j.retry.instances.inventoryService.waitDuration=5s

#Email configuration
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
