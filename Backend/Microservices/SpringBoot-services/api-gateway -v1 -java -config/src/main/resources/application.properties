spring.application.name=api-gateway
server.port=2000
spring.devtools.add-properties=true
spring.devtools.restart.enabled=true

#spring oauth2 resouce security server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1040/realms/shopApp-microservices-security-realm

# Documentation configuration
springdoc.api-docs.path=/gateway/api-docs
springdoc.swagger-ui.path=/gateway/swagger-ui.html

# Configure aggregated remote docs through the gateway
springdoc.swagger-ui.urls[0].name=Product Service API
springdoc.swagger-ui.urls[0].url=/product/api-docs
springdoc.swagger-ui.urls[1].name=Order Service API
springdoc.swagger-ui.urls[1].url=/order/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service API
springdoc.swagger-ui.urls[2].url=/inventory/api-docs

#URL Configurations for routing
product.service.url=http://localhost:1000
order.service.url=http://localhost:1005
inventory.service.url=http://localhost:1025

# Request Predicates for routing
product.service.predicate=/api/products/**
order.service.predicate=/api/orders/**
inventory.service.predicate=/api/inventory/**

#To Disable openapi docs
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

#Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/gateway/actuator
management.health.circuitbreakers.enabled=true

#Circuit Breaker configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=3

# timeout configuration for gateway routes to the fallback route
resilience4j.timelimiter.configs.default.timeoutDuration=10s

#Resilience4j retry configuration for gateway routes
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=2s